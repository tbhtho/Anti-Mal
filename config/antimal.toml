base_vhdx_path = "C:/AntiMalRuns/_base/AntiMalBase.vhdx"
base_disk_path = "C:/AntiMalRuns/_base/AntiMalBase.raw"
base_disk_format = "raw"
workspace_root = "C:/AntiMalRuns"
vm_name_prefix = "AntiMal"
default_timeout_sec = 180
network_mode = "disabled"
driver_bridge_mode = "off"
vm_provider = "inhouse"

# Enrichment pipeline. Tools shell out to redistributables next to AntiMal.exe.
enrich_yara = true
enrich_capa = true
enrich_die = true
enrich_tagger = true
yara_rules_dir = ""
tags_rules_path = ""

# Network-required threat intel. Off by default. virustotal needs a key.
intel_enabled = false
intel_malwarebazaar = true
virustotal_api_key = ""

# Dynamic-observation knobs. Read by GuestAgent.
# Off by default: the GUI "Detonate Sample (live)" still executes (it arms the
# per-run env keys + --allow-execution); this only keeps the CLI `detonate` path
# from executing without an explicit --allow-execution. Restores the 2-key gate.
dynamic_execution_enabled = false
collect_screenshots = true
screenshot_interval_ms = 2000

# Virtual guest clock base, as a unix epoch (seconds). 0 = auto: the VM captures
# host time once at boot (so TLS/cert validation works) and then advances the
# guest clock on its own crystal, never re-reading the host wall-clock - so
# reports don't leak your real date. Set a non-zero epoch to pin the guest's
# start date (e.g. to trip date-gated "logic bomb" malware). The live control
# path is the ANTIMAL_GUEST_EPOCH env var; this is the persisted default for it.
vm_guest_clock_epoch = 0

# Live-VM hands-free login: password | autologon (no password) | manual.
# "manual" = you drive the login yourself in the live console (click the password
# box, type the password, press Enter). The account password is below.
vm_login_mode = "manual"
vm_login_password = "AntiMal!23"
