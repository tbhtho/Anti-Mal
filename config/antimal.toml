# AntiMal MVP configuration.
base_vhdx_path = "C:/AntiMalRuns/_base/AntiMalBase.vhdx"
base_disk_path = "C:/AntiMalRuns/_base/AntiMalBase.raw"
base_disk_format = "raw"
workspace_root = "C:/AntiMalRuns"
vm_name_prefix = "AntiMal"
default_timeout_sec = 180
network_mode = "disabled"
driver_bridge_mode = "off"
vm_provider = "inhouse"

# Enrichment pipeline. Tools shell out to redistributables next to AntiMal.exe.
enrich_yara = true
enrich_capa = true
enrich_die = true
enrich_tagger = true
yara_rules_dir = ""
tags_rules_path = ""

# Network-required threat intel. Off by default. virustotal needs a key.
intel_enabled = false
intel_malwarebazaar = true
virustotal_api_key = ""

# Dynamic-observation knobs. Read by GuestAgent.
# Key 1 of the three-key execution gate. The CLI still requires
# --allow-execution (key 2) plus ANTIMAL_ARM_GUEST_EXEC=1 (key 3).
dynamic_execution_enabled = true
collect_screenshots = true
screenshot_interval_ms = 2000

# Virtual guest clock base, as a unix epoch (seconds). 0 = auto.
vm_guest_clock_epoch = 0

# Live-VM hands-free login: password | autologon (no password) | manual.
# The base was built with a baked AutoLogon for 'antimal', so the host does not
# need to inject login input - manual avoids stray keystrokes into the desktop.
vm_login_mode = "manual"
vm_login_password = "AntiMal!23"
