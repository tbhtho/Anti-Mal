<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://runs.antimal.local; frame-src https://runs.antimal.local; connect-src 'none'; base-uri 'none'; form-action 'none';">
  <title>AntiMal - Scanner and VM Analysis</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <!-- Top status bar -->
    <header class="topbar">
      <span class="brand">AntiMal<span class="vx">.VX</span></span>
      <span class="badge idle" id="mode-badge"><span class="dot"></span>Sandbox Ready</span>
      <span class="badge idle" id="vm-badge"><span class="dot"></span>VM Idle</span>
      <span class="spacer"></span>
      <div class="actions">
        <button class="btn" data-cmd="scan.file">Scan File</button>
        <button class="btn" data-cmd="scan.folder">Scan Folder</button>
        <button class="btn" data-cmd="scan.computer">Scan Computer</button>
        <button class="btn danger" data-cmd="detonate.selected" title="Pick a BENIGN sample and run it live in the VM — watch it execute on the VM Analysis page">Detonate Sample</button>
      </div>
      <div class="segmented" id="network" title="Display only — network mode is set in config/antimal.toml or via detonate --network">
        <button data-net="disabled" class="on" disabled>Disabled</button>
        <button data-net="isolated" disabled>Isolated</button>
        <button data-net="live" disabled>Live</button>
      </div>
      <span class="field">Flag &ge; <input id="flag" type="number" value="70" min="0" max="100" disabled title="Display only — set the flag threshold via config or scan --threshold"></span>
      <span class="field">VM sec <input id="vmsec" type="number" value="180" min="10" disabled title="Display only — set the VM timeout via config (default_timeout_sec) or detonate --timeout-sec"></span>
      <span class="toggle disabled" id="autodet" title="Not wired — detonation is gated off (boots run a healthcheck only)"><span class="track"></span>Auto-detonate</span>
    </header>

    <div class="body">
      <!-- Left sidebar -->
      <aside class="sidebar">
        <div class="logo">AntiMal<span class="vx">.VX</span><span class="sub">Local malware analysis &amp; VM inspection</span></div>
        <nav class="nav" id="nav">
          <a data-page="dashboard" class="active"><span class="ico">▦</span>Dashboard</a>
          <a data-page="scan"><span class="ico">⌕</span>Scan</a>
          <a data-page="vm"><span class="ico">▷</span>VM Analysis</a>
          <a data-page="reports"><span class="ico">▤</span>Reports</a>
          <a data-page="base"><span class="ico">⚙</span>Base Setup</a>
          <a data-page="config"><span class="ico">⚙</span>Config</a>
          <a data-page="safety"><span class="ico">⛨</span>Safety</a>
        </nav>
        <div class="foot"><span class="dot"></span>Safety mode active</div>
      </aside>

      <!-- Main content (router target) -->
      <main id="content"></main>

      <!-- Right status log -->
      <aside class="logpanel">
        <h2>Status Log</h2>
        <div class="logtools">
          <button class="f on" data-filter="all">All</button>
          <button class="f" data-filter="info">Info</button>
          <button class="f" data-filter="warn">Warn</button>
          <button class="f" data-filter="error">Err</button>
          <input id="logsearch" placeholder="Search log…">
        </div>
        <div class="log" id="log"></div>
      </aside>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
